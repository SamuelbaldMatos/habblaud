# Habblaud no Docker local.
#
# Suba com `npm run docker:up`: o script detecta as contas do Claude Code no host e gera o
# docker-compose.override.yml (fora do controle de versão) com:
#   - montagens SOMENTE LEITURA de <conta>/projects e <conta>/sessions em /claude/<conta>/...
#     (nunca a pasta inteira da conta: lá ficam credenciais e configurações) e de ~/.habblaud/usage
#     (uso de 5h/semanal capturado pelo tap de statusline) em /usage;
#   - HABBLAUD_CLAUDE_DIRS, HABBLAUD_ACCOUNTS e HABBLAUD_USAGE_DIR.
# O Compose mescla o override automaticamente em qualquer `docker compose ...` rodado nesta pasta.
name: habblaud

services:
  habblaud:
    build: .
    image: habblaud:local
    container_name: habblaud
    restart: unless-stopped
    # Os transcripts são sensíveis: por padrão a porta é publicada SÓ na interface local do host
    # (HABBLAUD_BIND=0.0.0.0 no .env libera a rede local; veja o README).
    ports:
      - "${HABBLAUD_BIND:-127.0.0.1}:${HABBLAUD_PORT:-4747}:4747"
    volumes:
      - habblaud-data:/data
      - .:/workspace:rw
      - habblaud-agent-deps:/workspace/node_modules
      # Shared vault; per-runtime vector cache in /data avoids cross-OS SQLite writers.
      - I:/Cerebro:/cerebro:ro
      - I:/CarecaBrain/CarecaBrain:/vault:ro
      - I:/CarecaBrain/CarecaBrain/conhecimento/sessoes-compartilhadas:/vault/conhecimento/sessoes-compartilhadas:rw
      - I:/CarecaBrain/_ferramentas:/cerebro-tools:ro
      - I:/Jarvis/dados:/jarvis-data:ro
    mem_limit: 8g
    # Opções que podem vir do .env (ou do ambiente) para dentro do container.
    environment:
      HABBLAUD_ALLOWED_HOSTS: ${HABBLAUD_ALLOWED_HOSTS:-}
      HABBLAUD_DEMO: ${HABBLAUD_DEMO:-}
      # O mesmo valor da porta publicada acima: o terminal somente leitura só liga com bind local.
      HABBLAUD_BIND: ${HABBLAUD_BIND:-127.0.0.1}
      HABBLAUD_TERMINAL: ${HABBLAUD_TERMINAL:-}
      HABBLAUD_AGENT_WORKSPACE: /workspace
      HABBLAUD_AGENT_TOKEN_BUDGET: ${HABBLAUD_AGENT_TOKEN_BUDGET:-120000}
      HABBLAUD_CEREBRO_CLI: /cerebro/cerebro-cli.mjs
      HABBLAUD_CEREBRO_PROJECT: OmniRoute + Habblaud
      CEREBRO_VAULT: /vault
      CEREBRO_INDICE: /cerebro-tools/capacidades.json
      CEREBRO_ROTEADOR: /cerebro-tools/roteador.mjs
      CEREBRO_VETORES_DB: /jarvis-data/jarvis.db
      CEREBRO_VETORES_CACHE: /data/cerebro-vetores.sqlite
      CEREBRO_OLLAMA_URL: http://host.docker.internal:11434
      # 0 desliga a verificação de versão nova (consulta às releases no GitHub a cada 6 h).
      HABBLAUD_UPDATE_CHECK: ${HABBLAUD_UPDATE_CHECK:-}
      OMNIROUTE_URL: ${OMNIROUTE_URL:-http://host.docker.internal:20128}
      OMNIROUTE_TOKEN: ${OMNIROUTE_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Endurecimento: sistema do container só leitura; /data, /tmp e workspace explicitamente montados.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Processo init mínimo: repassa sinais e recolhe processos órfãos.
    init: true

volumes:
  habblaud-data:
  habblaud-agent-deps:
